const map=L.map('map',{zoomControl:false}).setView([-19.0,29.5],6.4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);

const grid=document.getElementById('grid');
const count=document.getElementById('count');

function render(list){
 grid.innerHTML="";
 list.forEach((p,i)=>{
  const isTop=i<12;
  const badgeClass=p.type==="Waterfalls"?"b-water":p.type==="National Parks"?"b-park":p.type==="Mountains"?"b-mount":"b-lake";
  L.marker([p.lat,p.lng]).addTo(map).bindPopup(`<b>${i+1}. ${p.name}</b><br>${p.rating} - ${p.type}`);
  grid.innerHTML+=`
  <div class="card" data-type="${p.type}">
    ${isTop?`<div class="top">#${i+1} TOP</div>`:""}
    <img src="${p.img}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1506905925346-21bda4d32df4'">
    <div class="pad">
      <span class="badge ${badgeClass}">${p.type}</span><span class="rating">${p.rating}</span>
      <h3>${i+1}. ${p.name}</h3>
      <p>${p.desc}</p>
    </div>
  </div>`;
 });
 count.innerText=`Showing ${list.length} / 100 natural attractions - Top 12 most visited first`;
}
render(places);

// filter
document.querySelectorAll('.filter button').forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const t=btn.innerText;
  if(t.includes("All")) render(places);
  else render(places.filter(p=>p.type===t));
  map.invalidateSize();
 }
});
</script>
